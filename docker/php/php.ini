; =============================================
; PHP Configuration for Docker (Development)
; =============================================

; Memory
memory_limit = 256M

; Upload
upload_max_filesize = 10M
post_max_size = 10M

; Execution
max_execution_time = 120
max_input_time = 60

; Error handling
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Date
date.timezone = UTC

; Sessions
session.gc_maxlifetime = 1209600
session.cookie_secure = 0
