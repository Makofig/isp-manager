# Docker Compose Override for Production
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes: []

  queue:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes: []

  setup:
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
    volumes: []

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
