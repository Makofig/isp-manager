services:
  mysql:
    image: mysql:8.0
    container_name: laravel_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-intersys}
      MYSQL_USER: ${DB_USERNAME:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-admin123456}

    volumes:
      - mysql_data:/var/lib/mysql

    ports:
      - "${DB_PORT_HOST:-3309}:3306"

    networks:
      - laravel

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "127.0.0.1",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD:-rootpassword}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

  setup:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel_setup

    restart: "no"

    working_dir: /var/www

    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro

    depends_on:
      mysql:
        condition: service_healthy

    networks:
      - laravel

    command: ["/usr/local/bin/setup.sh"]

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel_app

    restart: unless-stopped

    working_dir: /var/www

    depends_on:
      setup:
        condition: service_completed_successfully

    volumes:
      - .:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro

    networks:
      - laravel

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: laravel_queue

    restart: unless-stopped

    working_dir: /var/www

    depends_on:
      setup:
        condition: service_completed_successfully

    volumes:
      - .:/var/www

    networks:
      - laravel

    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]

  nginx:
    image: nginx:stable-alpine

    container_name: laravel_nginx

    restart: unless-stopped

    ports:
      - "${APP_PORT:-5005}:80"

    volumes:
      - .:/var/www:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      app:
        condition: service_started

    networks:
      - laravel

volumes:
  mysql_data:
    driver: local

networks:
  laravel:
    driver: bridge
